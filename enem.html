
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="description"
        content="Questões de Matemática do ENEM organizadas por ano, aplicação e assunto.">
  <title>ENEM | IS Matemática</title>

  <style>
    :root {
      --texto: #1c2430;
      --secundario: #64748b;
      --borda: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--texto);
      background: #ffffff;
      line-height: 1.6;
    }

    header {
      border-bottom: 1px solid var(--borda);
    }

    .barra {
      max-width: 1100px;
      margin: auto;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .marca {
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      color: var(--texto);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
    }

    nav a {
      color: var(--secundario);
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover,
    nav a.ativo {
      color: var(--texto);
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 60px 24px 100px;
    }

    .etiqueta {
      color: var(--secundario);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(34px, 5vw, 48px);
      letter-spacing: -1.5px;
      line-height: 1.2;
      margin: 16px 0;
    }

    .introducao {
      color: var(--secundario);
      margin-bottom: 40px;
      max-width: 650px;
    }

    .filtros {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }

    .campo-busca {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      background: white;
      font: inherit;
      color: var(--texto);
    }

    input:focus, select:focus {
      outline: 2px solid #64748b;
      outline-offset: 2px;
    }

    .contador {
      font-size: 14px;
      color: var(--secundario);
      margin-bottom: 20px;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .questao {
      border: 1px solid var(--borda);
      padding: 25px;
      border-radius: 12px;
    }

    .metadados {
      color: var(--secundario);
      font-size: 12px;
    }

    .questao h2 {
      font-size: 21px;
      margin: 12px 0;
    }

    .questao p {
      color: var(--secundario);
      font-size: 14px;
    }

    .vazio {
      text-align: center;
      border: 1px dashed var(--borda);
      border-radius: 12px;
      padding: 65px 20px;
    }

    .vazio h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .vazio p {
      color: var(--secundario);
      max-width: 400px;
      margin: auto;
    }

    .link-material {
      display: inline-block;
      margin-top: 14px;
      color: var(--texto);
      font-weight: bold;
      font-size: 14px;
    }

    footer {
      border-top: 1px solid var(--borda);
      text-align: center;
      padding: 30px;
      color: var(--secundario);
      font-size: 13px;
    }

    @media (max-width: 650px) {
      main { padding-top: 35px; }
      .grade { grid-template-columns: 1fr; }
      .filtros { grid-template-columns: 1fr; }
      .campo-busca { grid-column: auto; }
    }
  </style>
</head>

<body>

<header>
  <div class="barra">
    <a class="marca" href="index.html">IS Matemática.</a>

    <nav aria-label="Menu principal">
      <a href="index.html">Início</a>
      <a href="enem.html" class="ativo">ENEM</a>
      <a href="atividades.html">Atividades</a>
      <a href="projetos.html">Projetos</a>
      <a href="index.html#sobre">Sobre</a>
    </nav>
  </div>
</header>

<main>
  <section>
    <div class="etiqueta">Banco de questões</div>
    <h1>Matemática no ENEM</h1>

    <p class="introducao">
      Explore questões de Matemática do ENEM
      organizadas por ano, tipo de aplicação
      e conteúdo matemático.
    </p>
  </section>

  <section aria-label="Filtros de questões">
    <div class="filtros">

      <div class="campo-busca">
        <label for="pesquisa">Pesquisar assunto</label>
        <input
          type="search"
          id="pesquisa"
          placeholder="Ex.: funções, geometria, probabilidade..."
        >
      </div>

      <div>
        <label for="ano">Ano da prova</label>
        <select id="ano">
          <option value="">Todos os anos</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
        </select>
      </div>

      <div>
        <label for="aplicacao">Aplicação</label>
        <select id="aplicacao">
          <option value="">Todas as aplicações</option>
          <option value="Regular">Regular</option>
          <option value="PPL">PPL</option>
        </select>
      </div>

    </div>
  </section>

  <section aria-label="Resultados">
    <p class="contador" id="contador" aria-live="polite">
      Carregando questões...
    </p>
    <div id="resultados"></div>
  </section>
</main>

<footer>
  IS Matemática — Compartilhando conhecimento.
</footer>

<script>
  let questoes = [];

  const pesquisa = document.getElementById("pesquisa");
  const ano = document.getElementById("ano");
  const aplicacao = document.getElementById("aplicacao");
  const resultados = document.getElementById("resultados");
  const contador = document.getElementById("contador");

  function elemento(tag, classe, texto) {
    const el = document.createElement(tag);

    if (classe) el.className = classe;
    if (texto !== undefined) el.textContent = texto;

    return el;
  }

  function mensagemVazia(titulo, descricao) {
    const caixa = elemento("div", "vazio");
    caixa.appendChild(elemento("h2", "", titulo));
    caixa.appendChild(elemento("p", "", descricao));
    resultados.replaceChildren(caixa);
  }

  function mostrarQuestoes() {
    const termo = pesquisa.value
      .toLocaleLowerCase("pt-BR")
      .trim();

    const anoSelecionado = ano.value;
    const tipoSelecionado = aplicacao.value;

    const filtradas = questoes.filter(q => {
      const texto = [
        q.assunto,
        q.enunciado,
        q.numero
      ].join(" ").toLocaleLowerCase("pt-BR");

      return (
        texto.includes(termo) &&
        (!anoSelecionado ||
          String(q.ano) === anoSelecionado) &&
        (!tipoSelecionado ||
          q.aplicacao === tipoSelecionado)
      );
    });

    contador.textContent =
      `${filtradas.length} questão(ões) encontrada(s)`;

    resultados.replaceChildren();

    if (questoes.length === 0) {
      mensagemVazia(
        "Banco de questões em preparação",
        "Em breve, você encontrará questões de Matemática do ENEM organizadas por ano, aplicação e assunto."
      );
      return;
    }

    if (filtradas.length === 0) {
      mensagemVazia(
        "Nenhuma questão encontrada",
        "Tente utilizar outros filtros ou termos de pesquisa."
      );
      return;
    }

    const grade = elemento("div", "grade");

    filtradas.forEach(q => {
      const cartao = elemento("article", "questao");

      cartao.appendChild(
        elemento(
          "div", "metadados",
          `ENEM ${q.ano} • ${q.aplicacao} • Questão ${q.numero}`
        )
      );

      cartao.appendChild(
        elemento("h2", "", q.assunto || "Matemática")
      );

      cartao.appendChild(
        elemento("p", "", q.enunciado || "")
      );

      if (
        typeof q.link === "string" &&
        /^https:\/\/(drive\.google\.com|docs\.google\.com)\//.test(q.link)
      ) {
        const link = elemento(
          "a", "link-material", "Visualizar questão ↗"
        );

        link.href = q.link;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        cartao.appendChild(link);
      }

      grade.appendChild(cartao);
    });

    resultados.appendChild(grade);
  }

  async function carregarQuestoes() {
    try {
      const resposta = await fetch(
        "dados/questoes-enem.json"
      );

      if (!resposta.ok) {
        throw new Error("Arquivo de questões não encontrado.");
      }

      const dados = await resposta.json();

      if (!Array.isArray(dados)) {
        throw new Error("Os dados precisam ser uma lista.");
      }

      questoes = dados;
      mostrarQuestoes();

    } catch (erro) {
      contador.textContent =
        "Não foi possível carregar as questões.";

      mensagemVazia(
        "Erro ao carregar os dados",
        "Verifique se o arquivo de questões existe."
      );

      console.error(erro);
    }
  }

  pesquisa.addEventListener("input", mostrarQuestoes);
  ano.addEventListener("change", mostrarQuestoes);
  aplicacao.addEventListener("change", mostrarQuestoes);

  carregarQuestoes();
</script>

</body>
</html>
